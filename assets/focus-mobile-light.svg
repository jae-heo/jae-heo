<svg xmlns="http://www.w3.org/2000/svg" width="360" height="684" viewBox="0 0 360 684" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Areas of work and approach</title>
<desc id="desc">Backend engine modernization: reveal implicit rules, reshape the structure, and migrate incrementally. Domain architecture: model concepts, clarify ownership, and define interfaces. Infrastructure and DevOps: connect design to operations, improve deployment, and keep systems maintainable. Approach: understand the problem, model the domain, and evolve the system.</desc>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<text x="1" y="14" fill="#59636e" font-size="11" font-weight="600" letter-spacing="1.6">AREAS OF WORK</text>
<rect x="0.5" y="32.5" width="359" height="135" rx="10" fill="#f6f8fa" stroke="#d8dee4"/>
<text x="18" y="61" fill="#207565" font-size="12" font-weight="600" >01</text>
<text x="51" y="63" fill="#1f2328" font-size="22" font-weight="600" letter-spacing="-0.5">Backend engines</text>
<text x="51" y="92" fill="#1f2328" font-size="17" font-weight="400" >Reveal implicit rules.</text>
<text x="51" y="117" fill="#1f2328" font-size="17" font-weight="400" >Reshape the structure.</text>
<text x="51" y="142" fill="#1f2328" font-size="17" font-weight="400" >Migrate incrementally.</text>
<rect x="0.5" y="180.5" width="359" height="135" rx="10" fill="#f6f8fa" stroke="#d8dee4"/>
<text x="18" y="209" fill="#207565" font-size="12" font-weight="600" >02</text>
<text x="51" y="211" fill="#1f2328" font-size="22" font-weight="600" letter-spacing="-0.5">Domain &amp; boundaries</text>
<text x="51" y="240" fill="#1f2328" font-size="17" font-weight="400" >Model core concepts.</text>
<text x="51" y="265" fill="#1f2328" font-size="17" font-weight="400" >Clarify ownership.</text>
<text x="51" y="290" fill="#1f2328" font-size="17" font-weight="400" >Define interfaces.</text>
<rect x="0.5" y="328.5" width="359" height="135" rx="10" fill="#f6f8fa" stroke="#d8dee4"/>
<text x="18" y="357" fill="#207565" font-size="12" font-weight="600" >03</text>
<text x="51" y="359" fill="#1f2328" font-size="22" font-weight="600" letter-spacing="-0.5">Infra &amp; DevOps</text>
<text x="51" y="388" fill="#1f2328" font-size="17" font-weight="400" >Connect design to ops.</text>
<text x="51" y="413" fill="#1f2328" font-size="17" font-weight="400" >Improve deployment.</text>
<text x="51" y="438" fill="#1f2328" font-size="17" font-weight="400" >Keep systems maintainable.</text>
<path d="M0 490H360" stroke="#d8dee4"/>
<text x="1" y="519" fill="#59636e" font-size="11" font-weight="600" letter-spacing="1.6">FROM PROBLEM TO SYSTEM</text>
<path d="M10 546V643" stroke="#d8dee4" stroke-width="1.5"/>
<circle cx="10" cy="543" r="5" fill="#207565"/>
<text x="30" y="548" fill="#1f2328" font-size="18" font-weight="600" >Understand</text>
<text x="30" y="568" fill="#59636e" font-size="14" font-weight="400" >The problem &amp; its constraints</text>
<circle cx="10" cy="592" r="5" fill="#207565"/>
<text x="30" y="597" fill="#1f2328" font-size="18" font-weight="600" >Model</text>
<text x="30" y="617" fill="#59636e" font-size="14" font-weight="400" >The domain &amp; its boundaries</text>
<circle cx="10" cy="641" r="5" fill="#207565"/>
<text x="30" y="646" fill="#1f2328" font-size="18" font-weight="600" >Evolve</text>
<text x="30" y="666" fill="#59636e" font-size="14" font-weight="400" >The system, incrementally</text>
</g>
</svg>
